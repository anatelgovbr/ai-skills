name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias de teste
        run: pip install pytest pytest-cov

      - name: Rodar testes com cobertura
        run: python3 -m pytest --cov --cov-report=xml --cov-report=term

      - name: Gate de cobertura
        run: |
          python3 skills/testes-unitarios-cobertura/scripts/verificar_cobertura.py \
            coverage.xml --minimo 90

      - uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
